{% extends "base.html" %}
{% block title %}Resend Verification Link — SecureShop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="mb-0"><i class="bi bi-envelope-check me-2 text-primary"></i>Resend Account Confirmation</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.resend_verification') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Registered Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="you@example.com" maxlength="254" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Send New Single-Use Link</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
