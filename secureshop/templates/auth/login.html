{% extends "base.html" %}
{% block title %}Sign In — SecureShop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="mb-0"><i class="bi bi-box-arrow-in-right me-2 text-primary"></i>Sign In to SecureShop</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="next" value="{{ next_url or '' }}">
                    <input type="hidden" name="keystroke_intervals" id="keystrokeIntervals" value="[]">
                    <input type="hidden" name="is_pasted" id="isPasted" value="0">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username or Email Address</label>
                        <input type="text" name="identifier" class="form-control" placeholder="username or email" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" id="passwordInput" class="form-control" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-shield-lock me-1"></i>Continue to 2FA Verification
                    </button>
                </form>

                <hr class="my-4">
                <div class="bg-light rounded p-3 small">
                    <div class="text-muted">Need a new activation link? <a href="{{ url_for('auth.resend_verification') }}">Resend verification email</a>.</div>
                </div>
            </div>
            <div class="card-footer bg-light text-center py-3 small">
                New to SecureShop? <a href="{{ url_for('auth.register') }}" class="fw-semibold">Create an account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/security_telemetry.js') }}"></script>
{% endblock %}
