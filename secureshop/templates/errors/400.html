{% extends "base.html" %}
{% block title %}Bad Request (400) — SecureShop{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm p-5 text-center my-4">
    <h1 class="display-4 fw-bold text-warning">400</h1>
    <h4 class="mb-2">Invalid Request</h4>
    <p class="text-muted mb-4">Your request could not be processed due to invalid input or a missing security token.</p>
    <div><a href="{{ url_for('shop.catalogue') }}" class="btn btn-primary">Return to Catalogue</a></div>
</div>
{% endblock %}
