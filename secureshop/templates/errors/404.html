{% extends "base.html" %}
{% block title %}Page Not Found (404) — SecureShop{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm p-5 text-center my-4">
    <h1 class="display-4 fw-bold text-primary">404</h1>
    <h4 class="mb-2">Requested Resource Not Found</h4>
    <p class="text-muted mb-4">The page or product you requested does not exist or may have been moved.</p>
    <div>
        <a href="{{ url_for('shop.catalogue') }}" class="btn btn-primary">Return to Catalogue</a>
    </div>
</div>
{% endblock %}
