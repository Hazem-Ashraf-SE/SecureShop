{% extends "base.html" %}
{% block title %}Service Error (500) — SecureShop{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm p-5 text-center my-4">
    <h1 class="display-4 fw-bold text-danger">500</h1>
    <h4 class="mb-2">An Unexpected Error Occurred</h4>
    <p class="text-muted mb-4">We encountered an internal error processing your request. No sensitive details were exposed.</p>
    <div>
        <a href="{{ url_for('shop.catalogue') }}" class="btn btn-primary">Return to Home</a>
    </div>
</div>
{% endblock %}
